name: Tests

# The unit tests, on every push and pull request. Standard library only, so
# there is nothing to install beyond Python itself.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the tests
        run: python3 -m unittest discover -v tests
